
// Build.gradle generated for instrumentation module spring-web-async

apply plugin: 'java'

targetCompatibility = JavaVersion.VERSION_17

dependencies {
    implementation 'org.springframework:spring-core:7.0.0'

    // New Relic Java Agent dependencies
    implementation 'com.newrelic.agent.java:newrelic-agent:' + project.findProperty('java.agent.version')
    implementation 'com.newrelic.agent.java:newrelic-api:' + project.findProperty('java.agent.version')
    implementation 'com.newrelic.agent.java:agent-bridge:8.4.0'
    implementation fileTree(include: ['*.jar'], dir: '../test-lib')
}

jar {
  manifest {
    attributes 'Implementation-Title': 'com.newrelic.instrumentation.spring-async'
    attributes 'Implementation-Vendor': 'New Relic'
    attributes 'Implementation-Vendor-Id': 'com.newrelic'
    attributes 'Implementation-Version': 1.0
  }
}

verifyInstrumentation {
	passesOnly 'org.springframework:spring-core:[7.0.0,)'
        excludeRegex '.*M.*'
    excludeRegex '.*RC.*'

}
